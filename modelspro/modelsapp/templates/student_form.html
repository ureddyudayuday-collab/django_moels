<!DOCTYPE html>
<html>
<head>
    <title>Student Registration</title>

    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
            background-color: #f2f2f2;
        }

        .container {
            width: 400px;
            margin: 50px auto;
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 0 10px gray;
        }

        h2 {
            text-align: center;
        }

        label {
            display: block;
            margin-top: 15px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 20px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background-color: #0056b3;
        }
    </style>
</head>

<body>

<div class="container">

    <h2>Student Registration</h2>

    <form method="POST">

        {% csrf_token %}

        {{ form.as_p }}
        Name:
        <input type="text" name="name"><br><br>

        Roll No:
        <input type="number" name="roll"><br><br>

        class:
        <input type="text" name="class"><br><br>

        Age:
        <input type="number" name="age"><br><br>

        Parent contact:
        <input type="text" name="contact"><br><br>
        

        <button type="submit">Register Student</button>

    </form>
   
    <p>{{message}}</p>
    <a href="/modelsapp/list">view Students</a>
</div>

</body>
</html>
