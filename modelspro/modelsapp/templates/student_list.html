<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h2>Student list</h2>
    <table border="1">
     <tr>
        <th>Name</th>
        <th>Roll</th>
        <th>Class</th>
        <th>Age</th>
        <th>Contact</th>
        <th>Actions</th>
     </tr>

     {% for s in Students %}
     <tr>
        <td>{{ s.name}}</td>
        <td>{{ s.roll_number}}</td>
        <td>{{ s.Student_class}}</td>
        <td>{{ s.age}}</td>
        <td>{{ s.Parent_contact}}</td>
        <td>
        <a href="/modelsapp/update/{{s.id}}">Edit</a>
        <a href="/modelsapp/delete/{{s.id}}">Delete</a>
        </td>
     </tr>
      {% endfor %}  
    </table>
</body>
</html>
